<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" >
</head>

<body>
    <header class="app-header">
        <div class="container">
            <h1>Weather App</h1>
            <p>Informações meteorológicas para você!</p>
        </div>
    </header>

    <main class="container">
        <section aria-labelledby="welcome-title">
            <h2 id="welcome-title">Consulte o clima</h2>
            <p>Digite o nome da cidade para consultar o clima.</p>

            <form id="city-search-form">
                <label for="city-input">Nome da cidade</label>
                
                <div class="search-group">
                    <input
                    type="text"
                    id="city-input"
                    name="city"
                    placeholder="ex.: Salvador"
                    required
                    >

                    <button type="submit">Pesquisar</button>
                </div>                
            </form>

            <div id="search-results">
                <p id="search-status" role="status" aria-live="polite"></p>
                <ul id="city-results-list"></ul>
            </div>
        </section>

        <section id="current-weather" aria-labelledby="weather-title">
            <h2 id="weather-title">Clima atual</h2>

            <p id="weather-status" role="status" aria-live="polite">Selecione uma cidade para consultar o clima.</p>

            <div class="weather-card" hidden>
                <h3 id="weather-city"></h3>
                <p id="weather-temperature"></p>
                <p id="weather-description"></p>
                <p id="weather-humidity"></p>
                <p id="weather-wind"></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
